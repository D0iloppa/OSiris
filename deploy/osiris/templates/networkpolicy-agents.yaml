# osiris-agents 네임스페이스 — 기본 deny + 5예외(70 §3.1/§3.2).
#
# `10-core-architecture.md` §2.6이 예고한 "1단계의 분리된 도커 네트워크"
# 가 여기서 "기본 deny + 5개 예외의 NetworkPolicy"가 된다. 70 §3.2/§7.3이
# 이미 명문화했듯 예외는 4개가 아니라 **5개**다 — kube-dns가 UDP/53뿐
# 아니라 TCP/53(대형 응답 폴백)도 필요하기 때문에 kube-dns 자체가 이미
# 두 개의 `to:` 항목을 요구한다(`10` §2.6의 `[2026-07-28 K2 전환]` 정정
# 문단, 70 §3.2 원문 그대로 인용됨).
#
# 5개 예외:
#   1. kube-dns UDP/53
#   2. kube-dns TCP/53   (대형 DNS 응답 폴백 — 위 정정 문단 근거)
#   3. nats:4222         (§8.3 "도달 가능한 것은 nats/osiris-core:8090/
#                          osiris-egress:3128 셋뿐"의 하나)
#   4. osiris-egress:3128 (A3 단일 이그레스 집행, §3.2)
#   5. osiris-core:8090  (에이전트 대면 그래프-쓰기 API, §2.6 네트워크
#                          배치표 "별도 포트 + 에이전트 토큰 인증")
#
# ingress: 원칙적으로 없음. 에이전트는 NATS 구독자이지 서버가 아니다 —
# `10-core-architecture.md` §2.6의 원 YAML 골격이 유일하게 둔 ingress 예외는
# "osiris-core로부터"인데, 이것은 core가 에이전트에게 접속을 *거는* 방향이
# 아니라 실측 확인용 잔재 표기다(core는 에이전트가 8090으로 거는 접속을
# 받을 뿐, core가 에이전트 Pod에 접속을 걸 필요가 없다 — NATS pub/sub과
# 에이전트가 core:8090을 호출하는 두 경로 모두 에이전트가 발신자다). 그래서
# 이 chart는 ingress를 완전히 비워 default-deny로 둔다 — 70 문서가 다르게
# 말하지 않는 한 이것이 최소 허용이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osiris-agents-default
  namespace: {{ include "osiris.agentsNamespace" . }}
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # 1. kube-dns — UDP/53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # 2. kube-dns — TCP/53 (대형 응답 폴백. 70 §3.2/§7.3, `10` §2.6 정정 문단)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: TCP
          port: 53
    # 3. nats:4222 — 이중 홈(osiris-system + osiris-agents), 실질 강제는 NATS ACL
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "osiris.systemNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: nats
      ports:
        - protocol: TCP
          port: 4222
    # 4. osiris-egress:3128 — A3 단일 이그레스 프록시(허용목록은 squid.conf 소관)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "osiris.systemNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: egress
      ports:
        - protocol: TCP
          port: 3128
    # 5. osiris-core:8090 — 에이전트 대면 그래프-쓰기 API(토큰 인증, §2.6)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "osiris.systemNamespace" . }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: core
      ports:
        - protocol: TCP
          port: 8090
