# osiris-system 네임스페이스 — 최소 허용 NetworkPolicy 집합.
#
# 접근 방식: agents 쪽(networkpolicy-agents.yaml)과 달리 osiris-system은
# 컴포넌트가 6종(core/api/orchestrator/omniroute/egress/console) + 2개
# 상태 저장소(neo4j/nats)라 "기본 deny 하나 + 예외 N개"로는 표현력이
# 부족하다. 대신 (1) 네임스페이스 전체를 막는 default-deny 하나 +
# (2) 컴포넌트별로 "누가 나에게/나는 누구에게" allow 정책을 각각 둔다.
# NetworkPolicy는 가산적(additive, OR)이므로 default-deny가 있어도 각
# 컴포넌트의 allow 정책이 그 컴포넌트를 위한 예외를 뚫는다.
#
# 근거가 된 배치도/표: `70-kubernetes-deployment.md` §2(네임스페이스·파드
# 배치), `10-core-architecture.md` §2.6 네트워크 배치표.
#
# 지켜야 하는 세 가지 경계(작업 지시가 명시):
#   1. Neo4j는 osiris-core만 도달 가능 + osiris-api는 읽기 전용으로 직접
#      접속(api/internal/graphread/client.go가 AccessModeRead 세션만 연다,
#      실제 코드로 확인함) — 그래프 쓰기 단일 관문(A5/G7/D17)은 core가
#      유지하고, api는 "쓰기 없는 손님"으로 별도 허용한다.
#   2. osiris-omniroute는 에이전트가 직접 도달 불가(`10` §9.0) — 이
#      네임스페이스 안에서도 omniroute의 ingress를 osiris-egress·
#      osiris-api·osiris-orchestrator로만 좁혀, 혹시 osiris-agents 쪽
#      NetworkPolicy가 뚫리는 사고가 나도 이쪽에서 2차 방어선이 되게 한다.
#   3. osiris-orchestrator는 에이전트가 도달 불가(§2.6) — orchestrator의
#      ingress를 osiris-api로만 좁힌다(osiris-agents 네임스페이스발 트래픽을
#      selector에 넣지 않는다).
#
# ★ TODO(감독 판단 필요): kubelet이 liveness/readiness probe를 걸 때 Pod IP로
# 직접(Service를 거치지 않고) 접속한다 — 이 트래픽의 출발지가 "Pod/네임스페이스
# 레이블이 붙은 또 다른 Pod"가 아니라 노드 자신이라, 아래 각 정책의
# podSelector/namespaceSelector 기반 ingress 규칙이 이 트래픽을 매칭하지
# 못할 수 있다. Calico/Cilium 등 일부 CNI는 host-originated 트래픽을
# NetworkPolicy 밖에서 예외 처리하지만, k3s 기본(K11 — kube-router netpol
# 컨트롤러)이 이걸 어떻게 다루는지는 70 §3.4가 이미 "[미검증]"으로 남긴
# 범위와 같은 성질의 질문이라 이 문서도 발명하지 않는다. `verify-isolation-
# k8s.sh`가 실측해야 닫히는 항목 중 하나로 남긴다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osiris-system-default-deny
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    # kube-dns는 네임스페이스 전체 baseline에 둔다 — 아래 컴포넌트별
    # allow 정책 각각에 DNS를 반복해서 적지 않기 위한 유일한 예외.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# --- neo4j: core(읽기+쓰기) + api(읽기 전용) + orchestrator(읽기 전용) 만 도달 가능 ---
# `10-core-architecture.md` §2.6: "neo4j | 에이전트가 도달 불가. 라우팅
# 자체가 없음".
#
# ★ [2026-07-28 정정] 이전 워커는 여기서 orchestrator를 selector에서
# 빼면서 "orchestrator가 neo4j에 붙는 것은 pre-K8s(compose) 시절 잔존
# 코드"라고 진단했다 — 그 진단은 틀렸다. 실측 근거:
#   1. compose 배치에서 osiris-orchestrator는 osiris-data(neo4j가 있는
#      네트워크)에 원래부터 붙는 설계다 — 잔존이 아니라 의도된 도달.
#   2. orchestrator/internal/graphdb/client.go는 명시적으로 읽기 전용
#      이다: 주석 원문 "there is no ExecuteWrite anywhere in this
#      package", 세션은 neo4j.AccessModeRead로만 연다.
#   3. orchestrator/internal/graphdb/derive.go의 DeriveAgentWorkloads()
#      (212줄)가 그래프를 읽어 desired 워크로드 집합을 만든다 — 이것이
#      수렴 루프의 핵심 경로이지 잔존 코드가 아니다.
#   4. G7의 원문은 "쓰기"에 관한 것이다: "G7 | Neo4j에 여러 컴포넌트가
#      직접 쓰기 | … | graph-write API 단일 관문(D17)". orchestrator는
#      쓰지 않으므로(위 2) G7이 막으려는 대상이 아니다.
# 따라서 orchestrator를 이 ingress에 추가하는 것은 D17/G7 위반이 아니다
# — "그래프 쓰기 단일 관문"은 여전히 core 하나뿐이고(core-allow의 egress,
# osiris-api-allow/orchestrator-allow의 neo4j egress 규칙 참고), 여기서
# 여는 것은 읽기 전용 도달 뿐이다. 이 CrashLoopBackOff는 orchestrator가
# `bolt://neo4j:7687`에 연결 자체를 못 해 발생한 것이었다(로그: "neo4j not
# ready yet ... retrying" → "fatal: context canceled") — env 잔존 문제가
# 아니라 이 NetworkPolicy가 정당한 독자를 빠뜨린 것이었다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osiris-neo4j-allow
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: neo4j
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: core
      ports:
        - protocol: TCP
          port: 7687
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 7687
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: orchestrator
      ports:
        - protocol: TCP
          port: 7687
---
# --- osiris-core: api/orchestrator(내부) + osiris-agents(그래프-쓰기 API) ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osiris-core-allow
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: core
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: orchestrator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "osiris.agentsNamespace" . }}
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: neo4j
      ports:
        - protocol: TCP
          port: 7687
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: nats
      ports:
        - protocol: TCP
          port: 4222
---
# --- nats: core/api/orchestrator(osiris-system) + osiris-agents(이중 홈) ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osiris-nats-allow
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: core
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: orchestrator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "osiris.agentsNamespace" . }}
      ports:
        - protocol: TCP
          port: 4222
---
# --- osiris-api: Ingress Controller(외부 진입) + 내부 3종 호출 ---
#
# Ingress 컨트롤러의 네임스페이스/레이블은 70 §8이 "미결"로 남긴 항목
# (K3 옆 칸 — 컨트롤러 종류 자체가 안 정해짐)이라 여기서 특정 네임스페이스
# 셀렉터로 좁힐 근거가 없다. `ingress: [{}]`(빈 selector = 모든 출처 허용,
# 포트로만 제한)로 두고 TODO를 남긴다 — 컨트롤러가 확정되면 그 네임스페이스
# 로 좁혀야 한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osiris-api-allow
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # TODO(감독 판단 필요): 70 §8 "Ingress 컨트롤러 종류" 미결 — 확정되면
    # namespaceSelector로 좁힐 것. 지금은 포트만 제한한 전면 허용.
    - {}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: neo4j
      ports:
        - protocol: TCP
          port: 7687
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: core
      ports:
        - protocol: TCP
          port: 8090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: orchestrator
      ports:
        - protocol: TCP
          port: 8081
    - to:
        {{- if eq (include "osiris.omnirouteExternal" .) "true" }}
        - ipBlock:
            cidr: {{ .Values.omniroute.external.ip }}/32
      ports:
        - protocol: TCP
          port: {{ .Values.omniroute.external.port }}
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: omniroute
      ports:
        - protocol: TCP
          port: 20128
        {{- end }}
---
# --- osiris-orchestrator: api만 도달 가능(에이전트 도달 불가, §2.6) ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osiris-orchestrator-allow
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: orchestrator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: neo4j
      ports:
        - protocol: TCP
          port: 7687
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: nats
      ports:
        - protocol: TCP
          port: 4222
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: core
      ports:
        - protocol: TCP
          port: 8090
    - to:
        {{- if eq (include "osiris.omnirouteExternal" .) "true" }}
        - ipBlock:
            cidr: {{ .Values.omniroute.external.ip }}/32
      ports:
        - protocol: TCP
          port: {{ .Values.omniroute.external.port }}
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: omniroute
      ports:
        - protocol: TCP
          port: 20128
        {{- end }}
    # ★ [Phase D-1] driver/kube + internal/operator (both wired into this
    # same Pod, see orchestrator-deployment.yaml) talk to the K8s API server
    # itself (Agent/Pod/PVC/ServiceAccount/Secret create/get/list/watch in
    # osiris-agents) via the in-cluster "kubernetes" Service. That Service
    # has NO backing pods with selectable labels — its Endpoints point at
    # the control plane process directly (often hostNetwork, off the pod
    # network entirely) — so unlike every other egress rule in this file,
    # a podSelector/namespaceSelector cannot express "the API server". The
    # only mechanism NetworkPolicy offers for a destination that is not a
    # pod is ipBlock, and the API server's real address is cluster-specific
    # and unknowable at chart-authoring time — the exact same unavoidable
    # gap egress-deployment.yaml's own TODO already documents for squid's
    # internet egress (0.0.0.0/0 restricted to the port actually used).
    # Verified needed: without this rule client-go's dynamic client got
    # "connection refused" reaching the apiserver from this Pod under the
    # default-deny baseline (real measurement, this phase).
    #
    # ★ PORT 6443, NOT 443 — SECOND REAL MEASUREMENT, NOT A GUESS. The
    # "kubernetes" Service in the default namespace fronts port 443, and
    # that is what OSIRIS_ code and every kubeconfig talks to
    # (https://10.43.0.1:443 in this cluster). But this k3s cluster's netpol
    # enforcement (kube-router, the K11 default) matches egress `ports:` on
    # the packet's port AFTER kube-proxy's DNAT rewrites Service port 443 to
    # the apiserver's real listening port — 6443 here (measured: the
    # `kubernetes` Endpoints object literally reads `<node-ip>:6443`, the
    # node's own IP, because k3s runs the apiserver hostNetwork on the
    # control-plane node). A rule allowing only port 443 was tested and
    # produced the exact same "connection refused" as no rule at all; adding
    # 6443 alongside it fixed it in this cluster. Both ports are kept (443
    # for any implementation that matches pre-DNAT, 6443 for kube-router's
    # observed post-DNAT behavior) since which one a given cluster's CNI
    # needs is exactly the kind of cluster-specific fact
    # egress-deployment.yaml's own TODO already says this chart cannot know
    # at authoring time.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# --- osiris-omniroute: 에이전트가 직접 도달 불가(`10` §9.0). ingress는
# egress 프록시(CONNECT 중계)·api(관리 오퍼레이션)·orchestrator(게이트웨이
# 헬스체크) + Ingress 컨트롤러 네임스페이스(외부 진입, K3 §3.3 — osiris-gw
# 폐지로 그 역할을 이어받음)로만 좁힌다. osiris-agents 네임스페이스는 이
# selector에 절대 넣지 않는다 — 그것이 §9.0이 명시한 그 문장 그대로다:
# "osiris-agents의 멤버가 아니므로 에이전트가 직접 도달할 경로는 없다."
#
# ★ [2026-07-28 실배포 실측] compose에서는 osiris-gw가 `/omni/`를 프록시했고
# gw는 osiris-edge(에이전트와 분리된 네임스페이스 성격)에 있어 omniroute에
# 닿았다. K3가 gw를 폐지하고 그 역할을 Ingress 컨트롤러로 넘겼으므로,
# 컨트롤러가 사는 네임스페이스(`.Values.ingress.controllerNamespace`, 기본
# ingress-nginx)가 그 허용을 물려받아야 한다 — 안 그러면 컨트롤러발 트래픽이
# 이 default-deny 뒤에서 거부되어 `/omni/`가 502가 된다(실측). 이 네임스페이스
# selector는 "Ingress 컨트롤러가 사는 네임스페이스"만 여는 것이지 osiris-agents
# 를 여는 것이 아니다 — §9.0의 경계와 겹치지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osiris-omniroute-allow
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: omniroute
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: egress
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: api
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: orchestrator
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.ingress.controllerNamespace }}
      ports:
        - protocol: TCP
          port: 20128
  egress:
    # omniroute 자신의 아웃바운드(실제 LLM 프로바이더행)도 osiris-egress를
    # 경유하도록 강제된다(A3 예외 없음, `10` §9.0, omniroute-statefulset.yaml
    # 의 HTTPS_PROXY/HTTP_PROXY env가 이미 그렇게 배선해 둠) — 이 정책은 그
    # 배선이 실제로 우회 불가능하도록 egress를 osiris-egress:3128 하나로
    # 좁힌다.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: egress
      ports:
        - protocol: TCP
          port: 3128
---
# --- osiris-egress: osiris-agents(A3 집행 대상) + omniroute(자신의
# HTTPS_PROXY 강제 아웃바운드) 두 소스에서만 프록시 포트로 도달 가능.
# egress 쪽은 이 chart의 존재 이유(허용목록 대상 인터넷)라서 완전히
# 좁힐 수 없다 — 아래 TODO 참고.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osiris-egress-allow
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: egress
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ include "osiris.agentsNamespace" . }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: omniroute
      ports:
        - protocol: TCP
          port: 3128
  egress:
    # squid.conf(egress-deployment.yaml)의 허용목록 대상 — omniroute는
    # 클러스터 내부(Service DNS로 도달), 나머지(github/npm/pypi/LLM
    # 프로바이더)는 진짜 인터넷이다.
    - to:
        {{- if eq (include "osiris.omnirouteExternal" .) "true" }}
        - ipBlock:
            cidr: {{ .Values.omniroute.external.ip }}/32
      ports:
        - protocol: TCP
          port: {{ .Values.omniroute.external.port }}
        {{- else }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: omniroute
      ports:
        - protocol: TCP
          port: 20128
        {{- end }}
    # TODO(감독 판단 필요): egress-deployment.yaml 상단 TODO와 같은 계열의
    # 갭이다 — squid가 실제로 나가야 할 인터넷 목적지(github.com 등)를
    # NetworkPolicy egress ipBlock으로 좁히려면 "클러스터 내부 Pod CIDR을
    # 제외한 나머지"(`ipBlock: {cidr: 0.0.0.0/0, except: [<클러스터 Pod
    # CIDR>]}`)가 필요한데, Pod CIDR은 클러스터마다 다르고 이 chart 작성
    # 시점에는 알 수 없다(egress-deployment.yaml이 이미 이 이유로 소스
    # IP ACL 분리를 생략함). 여기서는 443/80만 전면 허용해 최소한 클러스터
    # 내부 다른 포트(예: 8090/7687/4222)로의 오사용은 막되, 같은 443/80을
    # 여는 다른 osiris-system Pod로의 오사용까지는 막지 못한다 — 알려진
    # 격차로 남긴다(C-2 완료조건이 요구하는 "실측"이 이 격차의 실제 크기를
    # 확인해야 한다).
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
# --- osiris-console: Ingress Controller에서만 정적 자산 서빙 ---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osiris-console-allow
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: console
  policyTypes:
    - Ingress
  ingress:
    # TODO(감독 판단 필요): osiris-api-allow와 동일한 이유 — Ingress
    # 컨트롤러 종류·네임스페이스가 미결(70 §8)이라 전면 허용 + 포트 제한.
    - {}
