# K8/G5 — 사람이 아니라 컴포넌트가 쓰는 정적 자격증명은 K8s Secret으로
# 둔다(§4.4 K8, §0 K8: "master key는 K8s Secret으로 둔다"의 같은 원칙을
# 여기 플랫폼 컴포넌트 간 자격증명에도 적용한다 — 저장 매체가 파일이든
# Secret이든, "쓰는 데 필요한 권한 ≥ 그 값이 여는 권한"이라는 논거가
# 동일하게 성립한다).
#
# values.yaml의 secrets.* 값 자체는 이 리포에 커밋되는 기본값이 전부
# 빈 문자열이다 — 운영자가 별도 values-secret.yaml(커밋 금지)이나
# --set-string으로 채우거나, existingSecretName으로 이미 클러스터에 있는
# Secret(예: 외부 시크릿 매니저가 채운 것)을 가리켜 이 템플릿 자체를
# 건너뛴다.
#
# 여기 담는 것은 전부 "기존 컴포넌트가 지금 env로 읽는 값"이다
# (api/core/orchestrator의 internal/config/config.go, docker-compose.yml)
# — 이번 phase는 Go 코드를 파일 읽기로 바꾸지 않으므로(작업 지시 §3), env
# 자체는 유지하되 그 env의 값을 평문 하드코딩이 아니라 secretKeyRef로
# 채운다(각 워크로드 템플릿 참고).
{{- if not .Values.secrets.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: osiris-secrets
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  NEO4J_PASSWORD: {{ .Values.secrets.neo4jPassword | quote }}
  # NEO4J_AUTH — neo4j **서버**가 읽는 형태(`user/password` 한 덩어리).
  # NEO4J_PASSWORD(클라이언트 쪽)와 같은 값이어야 한다는 규율은 .env.example
  # 원문 그대로이며, 여기서 password 하나로부터 생성하므로 두 값이 어긋날 수 없다.
  # 서버 컨테이너에 NEO4J_PASSWORD를 주면 기동이 거부되는 이유는
  # neo4j-statefulset.yaml의 env 주석 참고.
  NEO4J_AUTH: {{ printf "neo4j/%s" .Values.secrets.neo4jPassword | quote }}
  CORE_API_TOKEN: {{ .Values.secrets.coreApiToken | quote }}
  NATS_CORE_PASSWORD: {{ .Values.secrets.natsCorePassword | quote }}
  NATS_ORCHESTRATOR_PASSWORD: {{ .Values.secrets.natsOrchestratorPassword | quote }}
  NATS_API_PASSWORD: {{ .Values.secrets.natsApiPassword | quote }}
  OSIRIS_OMNIROUTE_ADMIN_PASSWORD: {{ .Values.secrets.omnirouteAdminPassword | quote }}
  # ---------------------------------------------------------------------------
  # OSIRIS_OMNIROUTE_ROOT_KEY — [2026-09-11 사용자 확정] omniroute에 대한
  # **루트 자격증명**. 이 값 하나가 두 컨테이너에 서로 다른 이름으로 들어간다:
  #
  #   osiris-omniroute 컨테이너 → OMNIROUTE_API_KEY          (키를 인정하는 쪽)
  #   osiris-api 컨테이너       → OSIRIS_OMNIROUTE_MANAGE_KEY (키를 사용하는 쪽)
  #
  # 이름이 둘인 이유는 각 소비자가 읽는 변수명이 고정되어 있기 때문이다 —
  # omniroute 쪽은 벤더 앱의 계약(OMNIROUTE_API_KEY / ROUTER_API_KEY)이고,
  # osiris-api 쪽은 operations.mjs가 이미 읽는 이름이다(그래서 operations.mjs는
  # 이 설계에서 한 줄도 고치지 않는다). **값은 반드시 하나**여야 하므로 Secret
  # 키는 하나로 두고 두 워크로드가 같은 키를 가리킨다 — NEO4J_AUTH/
  # NEO4J_PASSWORD가 하나의 password에서 파생되는 것과 같은 규율이다.
  #
  # 왜 env-var 키인가(omniroute 소스 실측, src/lib/db/apiKeys.ts):
  #   - validateApiKey()가 `isConfiguredEnvApiKey(key)`면 DB 조회 없이 통과
  #     (:1129) — **SQLite에 이 키의 행이 존재하지 않는다**.
  #   - getApiKeyMetadata()가 `scopes: ["manage"]`를 합성해 반환(:1234~)하고,
  #     주석이 그 의도를 명시한다: "DO NOT remove manage from this list — that
  #     would break the deployment-time bootstrap path that operators rely on
  #     for headless / CI / first-boot scenarios."
  #   - sse/services/auth.ts:2445 "persistent passthrough keys that always
  #     validate, **surviving Docker restarts and backup restores without DB
  #     dependency**."
  #
  # 그래서 이 값은 설계상 **회전하지 않고 폐기되지 않는 root**다 — 대시보드
  # UI에 나타나지도, revoke 되지도 않으며, 바꾸는 유일한 방법은 이 Secret을
  # 갈고 두 파드를 재시작하는 것뿐이다. 그것이 채택 이유이기도 하다(사용자
  # 확정): 다른 키를 전부 분실해도 이 경로로 되살릴 수 있어야 한다(break-glass).
  #
  # ★ 주의 — 이름 충돌: OSiris 자신의 "마스터 키"(state/creds/admin/master_key)
  # 와 성질이 **정반대**다. 그쪽은 사용 즉시 회전하고 인수인계와 동시에 영구
  # 폐기되는 1회용 부트스트랩 자격증명이고, 이쪽은 영구 고정 root다. 문서·UI
  # 어디에서도 둘을 같은 낱말로 부르지 말 것.
  #
  # 권한 범위(과소평가 금지): manage 스코프는 저권한이 아니다 — 다른 API 키의
  # 평문을 reveal할 수 있고 새 키도 발급할 수 있어 사실상 관리자 권한 전체다.
  # ---------------------------------------------------------------------------
  OSIRIS_OMNIROUTE_ROOT_KEY: {{ .Values.secrets.omnirouteRootKey | quote }}
  # [폐기됨 2026-09-11] 온보딩 1단계가 omniroute 관리자 비밀번호를 교환해
  # 런타임에 받아오던 manage 키. 그 값은 프로세스 메모리(os.Setenv)와 PVC의
  # .env 파일에만 남았는데 config.Load()는 파일을 읽지 않아서, **파드가
  # 재시작될 때마다 증발했다**(2026-09-11 실측: 재시작 후 온보딩 2~5단계가
  # 전부 502). 루트 키는 런타임에 쓰이는 값이 아니라 부팅 시 Secret에서만
  # 들어오므로 그 실패 양식이 구조적으로 불가능하다. 이 키는 기존 배포와의
  # 호환을 위해 자리만 남겨 두며, 새 설치에서는 비어 있는 것이 정상이다.
  OSIRIS_OMNIROUTE_MANAGE_KEY: {{ .Values.secrets.omnirouteManageKey | quote }}
  OSIRIS_GATEWAY_TOKEN: {{ .Values.secrets.gatewayToken | quote }}
  # `[2026-07-28 Phase C-2b]` 결함 2 해소 (읽기 경로만): osiris-api의
  # ENV_FILE_PATH(compose의 ./.env 바인드 마운트 대응물)가 지금까지
  # emptyDir이었다 — Pod 재시작마다 사라지는 문제(api-deployment.yaml
  # 참고). 이 키는 그 emptyDir을 대체할 .env 형식 파일 내용을 담아
  # osiris-api 파드에 읽기 전용으로 마운트하는 용도다(위 두 키와 값은
  # 같다 — 이 키는 그 값들을 `KEY=VALUE\n` 형식 파일로 합쳐 담은 것뿐,
  # 새 자격증명이 아니다). 쓰기 경로(온보딩이 발급받은 토큰을 되쓰는 것)는
  # 이 phase의 범위가 아니다 — api-deployment.yaml의 TODO(C-3) 참고.
  REPO_ENV_FILE: |
    OSIRIS_GATEWAY_TOKEN={{ .Values.secrets.gatewayToken }}
    OSIRIS_OMNIROUTE_MANAGE_KEY={{ .Values.secrets.omnirouteRootKey }}
{{- end }}
