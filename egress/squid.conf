# osiris-egress — HTTP CONNECT 프록시, 도메인 허용목록 (§2.6, A3, A10)
#
# 이 컨테이너는 dev-net + osiris-agents + osiris-llm 세 망에 걸린 유일한
# 아웃바운드 전용 컴포넌트다(dev-net 멤버 수는 osiris-gw/osiris-egress
# 둘로 불변 — osiris-llm은 dev-net이 아니다, D10). 강제하는 것 세 가지:
#   1) 소스 ACL  — osiris-agents 대역(172.31.240.0/24)에서 온 요청만 pkg/
#                  github/osiris-omniroute 허용목록을 통과한다. dev-net 쪽에서
#                  (다른 프로젝트 컨테이너가) 이 프록시를 자기 것처럼 쓰려는
#                  시도는 거부된다 — 이것이 §2.6의 "핀홀을 좁히는" 실제 집행
#                  지점이다.
#   2) 목적지 허용목록 (에이전트→) — CONNECT 대상은 아래 pkg/github 도메인과
#                  osiris-omniroute:20128 뿐. 나머지 dev-net 호스트는
#                  허용목록에 없으므로 프록시를 통한 피벗이 불가능하다.
#   3) 목적지 허용목록 (osiris-omniroute→) — I5: OSiris 전용 omniroute
#                  인스턴스 자신의 실제 LLM 프로바이더행 아웃바운드도 이
#                  프록시를 강제로 거친다(A3에 예외를 두지 않는 결정 —
#                  IMPLEMENTATION-NOTES.md I5 참고, 실측: omniroute가
#                  HTTPS_PROXY/HTTP_PROXY 환경변수를 실제로 준수함을 확인).
#                  소스는 osiris-llm 대역(172.31.241.0/24)만, 목적지는 아래
#                  LLM 프로바이더 도메인 허용목록뿐이다. 사용자가 omniroute
#                  대시보드/API에서 새 프로바이더를 추가했는데 그 도메인이
#                  없으면 이 허용목록에 한 줄 추가 후 `docker compose restart
#                  osiris-egress`(무중단, 다른 허용 도메인에 영향 없음).
#
# 옛 공용 omniroute(dev-net, container_name "omniroute")를 위한 허용목록
# 항목(`allow_omniroute`)은 하위 호환을 위해 남겨 뒀다 — 지금은 아무 것도
# 그 경로를 쓰지 않는다(에이전트 게이트웨이 지향점이 osiris-omniroute로
# 전환됨, I5). 옛 공용 인스턴스 자체는 이 파일과 무관하게 그대로 운용된다.
#
# TLS 종단(MITM)은 하지 않는다 — CONNECT만 중계한다(§3.2 osiris-egress 책임).

visible_hostname osiris-egress
http_port 3128

dns_nameservers 127.0.0.11

# --- 캐시하지 않는다 (프록시일 뿐, 캐싱 프록시가 아니다) ---
cache deny all

# ---------------------------------------------------------------------------
# ACL 정의
# ---------------------------------------------------------------------------
acl agents_net src 172.31.240.0/24
# I5: osiris-omniroute's own subnet — allowed to reach real LLM provider
# domains only (see llm_provider_domains below), never the pkg/github lists.
acl omniroute_net src 172.31.241.0/24

acl CONNECT method CONNECT
acl SSL_ports port 443
acl SSL_ports port 20128
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 20128

# grant-catalog §8.1 net.egress.github / net.egress.pkg / llm.gateway 에 대응.
# files.pythonhosted.org(pip 실제 다운로드)와 sum.golang.org(go 체크섬 DB)는
# 설계 표에 명시되진 않았으나 pypi.org/proxy.golang.org의 동작상 필수 동반
# 호스트라 이 구현에서 추가했다 — docs/design/IMPLEMENTATION-NOTES.md 참조.
acl allow_domains dstdomain .github.com
acl allow_domains dstdomain .githubusercontent.com
acl allow_domains dstdomain registry.npmjs.org
acl allow_domains dstdomain pypi.org
acl allow_domains dstdomain files.pythonhosted.org
acl allow_domains dstdomain proxy.golang.org
acl allow_domains dstdomain sum.golang.org

# 옛 공용 omniroute(dev-net) — 하위 호환용, 지금은 미사용(위 헤더 코멘트 참고).
acl allow_omniroute dstdomain omniroute

# I5: 신설 OSiris 전용 omniroute — osiris-llm 위, 에이전트가 :20128로 도달.
acl allow_osiris_omniroute dstdomain osiris-omniroute

# I5: osiris-omniroute 자신이 실제로 호출할 LLM 프로바이더 도메인 허용목록.
# "160+ providers"를 자처하는 omniroute의 전체 카탈로그를 전부 미리 알 수는
# 없으므로, 주요 프로바이더로 시작하고 사용자가 대시보드/API에서 새 프로바이더를
# 추가하면 여기 한 줄 추가하는 것을 운영 절차로 문서화한다(IMPLEMENTATION-NOTES
# I5, docs/design/10-core-architecture.md §9.2). 준수 여부는 실측 확인됨.
acl llm_provider_domains dstdomain api.anthropic.com
acl llm_provider_domains dstdomain api.openai.com
acl llm_provider_domains dstdomain generativelanguage.googleapis.com
acl llm_provider_domains dstdomain aiplatform.googleapis.com
acl llm_provider_domains dstdomain .openai.azure.com
acl llm_provider_domains dstdomain api.mistral.ai
acl llm_provider_domains dstdomain api.cohere.ai
acl llm_provider_domains dstdomain api.cohere.com
acl llm_provider_domains dstdomain api.groq.com
acl llm_provider_domains dstdomain openrouter.ai
acl llm_provider_domains dstdomain api.together.xyz
acl llm_provider_domains dstdomain api.deepseek.com
acl llm_provider_domains dstdomain api.perplexity.ai
acl llm_provider_domains dstdomain api.x.ai

# ---------------------------------------------------------------------------
# 접근 제어 — 순서가 중요하다 (첫 매치 승리)
# ---------------------------------------------------------------------------
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# osiris-agents 대역 + 허용목록만 통과
http_access allow agents_net allow_domains
http_access allow agents_net allow_omniroute
http_access allow agents_net allow_osiris_omniroute

# I5: osiris-omniroute 자신의 아웃바운드 — LLM 프로바이더 도메인만
http_access allow omniroute_net llm_provider_domains

# 그 외 전부 거부 (dev-net 발신, 허용목록 밖 목적지 포함)
http_access deny all

# ---------------------------------------------------------------------------
# 감사 로그 — 모든 CONNECT 시도(허용/거부)를 기록한다.
# NATS ops.egress 서브젝트로의 발행은 osiris-core의 NATS 클라이언트 배선이
# 필요한 애플리케이션 로직이라 이번 단계 범위 밖이다(IMPLEMENTATION-NOTES 참조).
# access_log를 명시하지 않으면 squid 기본값(/var/log/squid/access.log, 내장
# "squid" 포맷)을 쓴다 — 이 이미지의 entrypoint가 그 파일을 `tail -F`로 stdout에
# 이어붙이므로 `docker logs osiris-egress`로 그대로 관찰된다.
# (참고: cache_effective_user로 권한을 낮춘 뒤에는 /dev/stdout에 직접 쓸 수
#  없어 FATAL로 죽는다 — stdio:/dev/stdout을 직접 쓰지 않는 이유.)
# ---------------------------------------------------------------------------
