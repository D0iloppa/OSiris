# osiris-api — 콘솔 REST/SSE 계약, 온보딩 0단계, GET /onboarding/status
# (§2 배치도: "Deployment, replicas>=1, DaemonSet 가능 — 60 H2 A2").
# docker.sock을 갖지 않는다(D4/G8) — 컨테이너 생성은 orchestrator 소관.
# Neo4j는 읽기 전용 세션만 연다 — 쓰기는 전부 osiris-core 경유(A5/G7/D17).
#
# 진입(K3): 이 chart는 Ingress를 만들지 않는다(C-2 범위) — 지금은 Service
# 하나만 노출해 둔다. 콘솔(nginx SPA)과의 관계도 K3와 같다: 정적 자산은
# console-deployment.yaml의 파드가, `/api/*`·SSE 경로 분기는 나중에 붙는
# Ingress가 맡는다(§3.3).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "osiris.apiServiceName" . }}
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    app.kubernetes.io/component: api
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: api
  ports:
    - name: health
      port: 8081
      targetPort: 8081
    - name: api
      port: 8443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osiris-api
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    app.kubernetes.io/component: api
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.api }}
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      # ServiceAccount: templates/rbac-api.yaml이 만들지만 어떤 Role/
      # ClusterRole도 바인딩하지 않는다(D4/G8 — osiris-api는 워크로드를
      # 만들지 못한다). bin/verify-isolation-k8s.sh의 [E2→RBAC] 검사가
      # 이 이름(app.kubernetes.io/component=api 라벨로 이 Pod을 찾고,
      # spec.serviceAccountName을 읽는다)에 의존하므로 이름을 바꾸지 않는다.
      serviceAccountName: osiris-api
      # `[2026-07-28 Phase C-3c]` repo-env 시딩 initContainer.
      #
      # 왜 initContainer인가: 온보딩 0-4단계가 게이트웨이 토큰/manage key를
      # /repo-env/.env에 **쓰려면** 그 마운트가 쓰기 가능해야 한다(아래 volumes
      # 섹션에서 emptyDir/Secret이 아니라 PVC로 바꿨다). 하지만 PVC는 처음
      # 만들어질 때 비어 있으므로, osiris-secrets Secret의 REPO_ENV_FILE(운영자가
      # --set으로 이미 채워 둔 초기값)을 최초 1회 PVC로 복사해야 한다.
      #
      # 왜 "파일이 이미 있으면 덮어쓰지 않는다"인가: 이 initContainer는 Pod이
      # 재시작될 때마다(재스케줄·롤아웃·OOM 등) 매번 다시 실행된다. 0단계가 이미
      # PVC의 .env에 실제 게이트웨이 토큰/manage key를 써 넣은 뒤라면, 재시작 때
      # 마다 Secret의 (더 오래된/비어 있는) 초기값으로 그걸 덮어써 버리면 0단계가
      # 재시작마다 도로 깨진다 — 그래서 대상 파일이 이미 존재하면 아무것도 하지
      # 않는다.
      #
      # 대가(코스트) — 다음 phase로 명시적으로 남김: 게이트웨이 토큰/manage key는
      # 이제 K8s Secret이 아니라 이 PVC 파일에 "산다"(최초 시딩 이후에는 Secret
      # 쪽 값은 더 이상 진실이 아니다). 이는 masterkey.Boot(Go, api/internal/
      # masterkey)가 지금도 PVC 파일에 master key를 직접 쓰는 것(K8s Secret으로
      # 두라는 K8 결정과 어긋나는 것)과 **같은 성질의 미완**이다 — 둘 다 "코드가
      # 파일 IO를 그대로 하고 있어서 영속 매체가 Secret이 아니라 파일"이라는
      # 문제이고, 둘을 함께 진짜 Secret으로 옮기는 재작성(Go/mjs 변경)은 이
      # phase의 범위 밖(작업 지시 §"절대 하지 말 것")이라 별도 phase로 남긴다.
      initContainers:
        - name: repo-env-seed
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              if [ -f /repo-env-pvc/.env ]; then
                echo "repo-env-seed: /repo-env-pvc/.env already exists — not overwriting (0단계가 쓴 값을 보존)"
              else
                echo "repo-env-seed: seeding /repo-env-pvc/.env from osiris-secrets Secret initial value"
                cp /repo-env-secret/.env /repo-env-pvc/.env
              fi
          volumeMounts:
            - name: repo-env-secret
              mountPath: /repo-env-secret
              readOnly: true
            - name: repo-env
              mountPath: /repo-env-pvc
      containers:
        - name: api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          imagePullPolicy: {{ .Values.images.api.pullPolicy }}
          ports:
            - name: health
              containerPort: 8081
            - name: api
              containerPort: 8443
          env:
            - name: HEALTH_ADDR
              value: ":8081"
            - name: API_ADDR
              value: ":8443"
            - name: PUBLIC_ORIGIN
              value: {{ .Values.publicOrigin | quote }}
            # osiris-gw는 K3로 폐지된다 — TRUSTED_PROXY_CIDR은 osiris-edge
            # 대역을 가리키던 값인데, 그 대역 자체가 compose 전용이라 여기
            # 서는 의미가 없다. Ingress Controller가 K3의 진입점이 되면
            # (C-2) 그 컨트롤러가 붙는 대역/CIDR로 다시 채워야 한다.
            - name: TRUSTED_PROXY_CIDR
              value: "0.0.0.0/0"
            - name: NEO4J_URI
              value: "bolt://{{ include "osiris.neo4jServiceName" . }}:7687"
            - name: NEO4J_USER
              value: "neo4j"
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "osiris.secretName" . }}
                  key: NEO4J_PASSWORD
            - name: NATS_API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "osiris.secretName" . }}
                  key: NATS_API_PASSWORD
            # dependent-env 치환 — core-statefulset.yaml 상단 주석과 동일한
            # 이유(NATS_URL에 시크릿을 합성).
            - name: NATS_URL
              value: "nats://osiris-api:$(NATS_API_PASSWORD)@{{ include "osiris.natsServiceName" . }}:4222"
            - name: CORE_BASE_URL
              value: "http://{{ include "osiris.coreServiceName" . }}:8090"
            - name: CORE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "osiris.secretName" . }}
                  key: CORE_API_TOKEN
            # omniroute.mode: embedded는 /omni basePath, external은 루트(values.yaml omniroute 주석)
            {{- $omniBase := printf "http://%s:20128%s" (include "osiris.omnirouteServiceName" .) (ternary "" "/omni" (eq (include "osiris.omnirouteExternal" .) "true")) }}
            - name: OSIRIS_GATEWAY_BASE_URL
              value: {{ $omniBase | quote }}
            - name: OSIRIS_GATEWAY_HEALTH_PATH
              value: {{ ternary "/healthz" "/v1/models" (eq (include "osiris.omnirouteExternal" .) "true") | quote }}
            - name: OSIRIS_OMNIROUTE_BASE_URL
              value: {{ $omniBase | quote }}
            # 콘솔이 omniroute 관리 UI를 여는 주소(GET /api/omniroute/console) — 하드코딩 금지
            - name: OSIRIS_OMNIROUTE_MODE
              value: {{ .Values.omniroute.mode | default "embedded" | quote }}
            - name: OSIRIS_OMNIROUTE_UI_URL
              {{- if eq (include "osiris.omnirouteExternal" .) "true" }}
              value: {{ required "omniroute.external.uiUrl is required when omniroute.mode=external" .Values.omniroute.external.uiUrl | quote }}
              {{- else }}
              value: "/omni/"
              {{- end }}
            - name: ORCHESTRATOR_BASE_URL
              value: "http://{{ include "osiris.orchestratorServiceName" . }}:8081"
            # [2026-09-11] **env 변수명은 그대로, 값의 출처만 루트 키로 옮겼다.**
            # operations.mjs가 읽는 이름이 OSIRIS_OMNIROUTE_MANAGE_KEY이므로
            # 그 파일을 고치지 않기 위해 이름은 유지하고, Secret 키만
            # OSIRIS_OMNIROUTE_ROOT_KEY를 가리키게 한다 — omniroute 컨테이너의
            # OMNIROUTE_API_KEY와 **같은 Secret 키**여야 값이 어긋날 수 없다.
            # 설계 근거는 secrets.yaml의 OSIRIS_OMNIROUTE_ROOT_KEY 주석.
            #
            # 이 값은 이제 부팅 시 한 번 들어오고 런타임에 바뀌지 않는다 —
            # 온보딩이 교환해 받아온 값을 os.Setenv로 덮어쓰던 경로가 사라졌다
            # (그 경로가 파드 재시작마다 자격증명을 잃던 원인이었다).
            - name: OSIRIS_OMNIROUTE_MANAGE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "osiris.secretName" . }}
                  # external 모드: 외부 인스턴스가 발급한 manage 키(루트 키는 embedded 전용)
                  key: {{ ternary "OSIRIS_OMNIROUTE_MANAGE_KEY" "OSIRIS_OMNIROUTE_ROOT_KEY" (eq (include "osiris.omnirouteExternal" .) "true") }}
                  optional: true
            - name: OMNIROUTE_OPERATIONS_SCRIPT
              value: /app/omniroute/operations.mjs
            - name: NODE_BIN
              value: node
            - name: ENV_FILE_PATH
              value: /repo-env/.env
            - name: MASTER_KEY_PATH
              value: /state/creds/admin/master_key
            - name: ADMIN_SETUP_TOKEN_PATH
              value: /state/creds/admin/setup_token
          volumeMounts:
            # TODO(감독 판단 필요): K8(§4.4)은 master key를 K8s Secret으로
            # 두라고 결정했지만, masterkey.Boot(Go, api/internal/masterkey)
            # 는 지금도 파일시스템에 스스로 키를 생성/기록한다 — 이번
            # phase는 Go 코드를 바꾸지 않으므로(작업 지시 §3/절대 하지
            # 말 것), 여기서는 잠정적으로 PVC(파일시스템, compose의
            # ./state/creds/admin 바인드 마운트와 동일한 의미)를 쓴다.
            # K8을 완전히 구현하려면 masterkey 패키지가 Secret API를 쓰도록
            # 바뀌어야 한다 — §6.2가 이미 "masterkey 패키지의 파일 IO
            # 절반"을 폐기 대상으로 못박아 뒀다(그 재작성이 이 phase가
            # 아니라 그 워커의 몫이라는 뜻).
            - name: state-creds-admin
              mountPath: /state/creds/admin
            # `[2026-07-28 Phase C-2b]` 결함 2 해소(읽기 경로) →
            # `[2026-07-28 Phase C-3c]` 쓰기 경로까지 해소.
            #
            # C-2b 상태: 이 마운트가 emptyDir → osiris-secrets Secret(읽기
            # 전용)으로 바뀌어 "재시작하면 사라진다"는 결함은 닫았지만, 온보딩
            # 0단계(§1.0.3~1.0.4)가 게이트웨이 토큰/manage key를 이 파일에 쓰려
            # 하면 Secret 마운트가 읽기 전용이라 EROFS로 실패했다(applyGatewayTokenToEnv/
            # applyManageKeyToEnv, omniroute/operations.mjs — Go/mjs는 이 phase
            # 에서 건드리지 않는다, 아래는 마운트만 바꾼 것).
            #
            # C-3c 상태: Secret을 쓰기 가능한 PVC로 바꿨다(volumes 섹션의
            # `persistentVolumeClaim: osiris-api-repo-env` 참고). 초기값은
            # initContainer(repo-env-seed, 위 spec.initContainers)가 Secret의
            # REPO_ENV_FILE에서 최초 1회만 복사해 넣는다. 이제 온보딩 0단계의
            # write가 EROFS 없이 성공한다.
            #
            # 왜 Secret으로 옮기지 않고 PVC인가: Secret을 patch하려면 osiris-api
            # 컨테이너에 k8s 클라이언트 + `patch secrets` RBAC 권한이 필요한데,
            # "osiris-api의 SA는 k8s 권한이 0이어야 한다"가 bin/verify-isolation-
            # k8s.sh의 [E2→RBAC] 검사가 지키는 불변식이다(옛 compose 검사
            # "osiris-api에 docker.sock이 없다"의 k8s 등가물, 위 serviceAccountName
            # 주석 참고) — 이번 phase에서 그 불변식을 흔들지 않는다.
            - name: repo-env
              mountPath: /repo-env
          # ★ [2026-07-28 실배포 실측 — 결함 3] startupProbe 신설 — core/
          # neo4j/nats와 같은 이유(compose start_period:15s/retries:3는
          # docker healthcheck를 unhealthy로만 표시하지만 k8s liveness는
          # 컨테이너를 죽인다). compose 예산(15+30=45초)에 여유를 더해 60초.
          startupProbe:
            httpGet:
              path: /livez
              port: 8081
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /livez
              port: 8081
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.resources.api.cpu | quote }}
              memory: {{ .Values.resources.api.memory | quote }}
            limits:
              cpu: {{ .Values.resources.api.cpu | quote }}
              memory: {{ .Values.resources.api.memory | quote }}
      volumes:
        - name: state-creds-admin
          persistentVolumeClaim:
            claimName: osiris-api-state-creds-admin
        # `[2026-07-28 Phase C-3c]` 쓰기 가능한 실제 마운트 — PVC. 초기값은
        # repo-env-seed initContainer가 아래 repo-env-secret volume에서 복사한다.
        - name: repo-env
          persistentVolumeClaim:
            claimName: osiris-api-repo-env
        # `[2026-07-28 Phase C-3c]` initContainer 전용 소스 — osiris-secrets
        # Secret의 REPO_ENV_FILE(운영자가 --set으로 채운 초기값)을 그대로
        # 읽기 전용으로 노출한다. 메인 컨테이너는 이 volume을 마운트하지
        # 않는다(메인 컨테이너는 위 PVC만 본다) — Secret은 최초 시딩에만 쓰인다.
        - name: repo-env-secret
          secret:
            secretName: {{ include "osiris.secretName" . }}
            items:
              - key: REPO_ENV_FILE
                path: .env
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: osiris-api-state-creds-admin
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    app.kubernetes.io/component: api
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storage.apiState.storageClassName }}
  storageClassName: {{ .Values.storage.apiState.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.apiState.size }}
---
# `[2026-07-28 Phase C-3c]` 온보딩 0단계 .env 쓰기 경로용 PVC. 위
# api-deployment.yaml의 repo-env volume/initContainer 주석 참고.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: osiris-api-repo-env
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    app.kubernetes.io/component: api
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.storage.repoEnv.storageClassName }}
  storageClassName: {{ .Values.storage.repoEnv.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.repoEnv.size }}
