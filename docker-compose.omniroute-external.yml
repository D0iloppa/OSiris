# docker-compose.omniroute-external.yml — 외부 omniroute 모드 오버레이 (선택).
#
# `.env`의 `OSIRIS_OMNIROUTE_MODE=external`일 때만 `osiris-up`이 이 파일을 함께
# 적용한다(기본값 embedded = 이 파일 미적용, 지금까지와 동일).
#
# 무엇을 하는가: `osiris-omniroute` 서비스를 **omniroute 설치(소스 빌드·데이터
# 볼륨) 대신 고정 대상 TCP 중계(socat)** 로 바꾼다. 같은 이름·같은 망 멤버십
# (osiris-llm + osiris-edge)을 유지하므로 나머지 스택은 그대로다:
#   - 에이전트 → osiris-egress(squid, `allow_osiris_omniroute`) → 중계 → 외부
#   - osiris-api(온보딩 오퍼레이션) → osiris-edge 직결 → 중계 → 외부
#   - osiris-api `depends_on: osiris-omniroute: service_healthy` 도 그대로 성립
# 격리: 중계만 외부 omniroute가 있는 망(`OSIRIS_OMNIROUTE_EXTERNAL_NET`)에 이중
# 홈된다. socat은 `OSIRIS_OMNIROUTE_EXTERNAL_ADDR` 한 곳으로만 연결하므로 범용
# 프록시가 되지 못한다 — A3(외부 통신은 osiris-egress 경유)는 에이전트·api 쪽에서
# 그대로 유지된다. 외부 omniroute 자신의 프로바이더행 아웃바운드는 OSiris 밖의 일이다.
#
# 달라지는 것(알고 켤 것):
#   - 외부 omniroute는 보통 루트 경로로 서빙한다 → `.env`의 base URL에서 `/omni`를
#     뺀다(OSIRIS_GATEWAY_BASE_URL, OSIRIS_OMNIROUTE_BASE_URL). osiris-up이 검사한다.
#   - osiris-gw의 `/omni/` 관리 UI 프록시는 외부 모드에서 쓰지 않는다(외부 UI는
#     외부 인스턴스 자신의 주소로 접속). 요청은 외부로 가서 404가 된다.
#   - OSIRIS_GATEWAY_TOKEN·OSIRIS_OMNIROUTE_MANAGE_KEY는 **외부 인스턴스가 발급한
#     값**이어야 한다(embedded에서 받은 값은 외부에서 무효) — 온보딩 0단계를
#     외부 기준으로 다시 수행한다.
#   - embedded의 데이터 볼륨(osiris-omniroute-data)은 지우지 않는다 — MODE를
#     embedded로 되돌리면 그대로 복귀한다.

networks:
  omniroute-external:
    external: true
    name: ${OSIRIS_OMNIROUTE_EXTERNAL_NET:?OSIRIS_OMNIROUTE_EXTERNAL_NET must be set in .env for external mode}

services:
  osiris-omniroute:
    build: !reset null
    image: alpine/socat:1.8.0.1
    command: ["TCP-LISTEN:20128,fork,reuseaddr", "TCP:${OSIRIS_OMNIROUTE_EXTERNAL_ADDR:?OSIRIS_OMNIROUTE_EXTERNAL_ADDR must be set in .env for external mode}"]
    environment: !reset {}
    volumes: !reset []
    networks:
      omniroute-external: {}
    healthcheck:
      # 외부 인스턴스에 TCP로 닿는지만 본다(HTTP 의미 검사는 api/에이전트의 게이트웨이 프로브 몫).
      test: ["CMD", "socat", "-u", "OPEN:/dev/null", "TCP:${OSIRIS_OMNIROUTE_EXTERNAL_ADDR}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
