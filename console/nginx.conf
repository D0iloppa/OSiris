# osiris-console 전용 nginx 설정 — K3(70-kubernetes-deployment.md §3.3)
# "콘솔 SPA는 자기 파드(nginx)가 정적 자산만 서빙한다"의 구현.
#
# 여기 없는 것 — 그리고 왜 없는지: `/_api/`·`/omni/` 같은 proxy_pass
# 라우팅 블록은 **의도적으로 옮기지 않았다.** K3의 배치는 "라우팅은
# Ingress Controller, 정적 서빙은 콘솔 파드"이므로, 그 분기는 이 파드가
# 아니라 나중에 붙는 Ingress(C-2 범위)가 담당한다(70-kubernetes-
# deployment.md §3.3). 이 파일은 gw/conf.d/default.conf 중 콘솔 정적
# 서빙에 해당하는 location들만, 원문 그대로 옮긴 것이다.
#
# base 이미지가 nginxinc/nginx-unprivileged라 8080에서 non-root(uid 101)로
# 수신한다(Dockerfile 참고) — gw/conf.d/default.conf의 `listen 80
# default_server;`와 포트만 다르다.

server {
    listen 8080 default_server;
    server_name _;

    root /usr/share/nginx/html;

    # 콘솔 슬롯 — **정확히 `/`뿐**(prefix 아님). gw/conf.d/default.conf의
    # `location = /` 블록 원문 그대로:
    #
    #   NOT `index index.html;` — deliberately. nginx's `index` directive
    #   serves a directory URI ("/") by doing an INTERNAL REDIRECT to
    #   "/index.html" and RE-RUNNING location matching on that new URI.
    #   `try_files` does not re-enter location matching — it serves the
    #   named file directly.
    location = / {
        try_files /index.html =404;
    }

    # 콘솔 SPA 정적 자산 — vite 빌드 산출물이 최상위 절대경로로 참조하는
    # 두 접두사. gw/conf.d/default.conf의 `location /assets/` /
    # `location /brand/` 블록 원문 그대로(root만 이 이미지의 단일 루트로
    # 맞춤 — gw는 console 전용 root와 html 전용 root를 분리했지만, 이
    # 이미지는 콘솔만 서빙하므로 분리할 다른 root가 없다).
    location /assets/ {
    }

    location /brand/ {
    }

    # OSiris 브랜드 정적 파일 — 파일명 열거가 아니라 두 접두사(favicon*,
    # osiris-mark*)로 예약한다. gw/conf.d/default.conf의 동일 location
    # 원문 그대로: 브랜드 마크의 테마 변형이 늘어날 때마다 파일명 열거는
    # 다시 깨지므로, 확장자가 아니라 이 두 접두사로 잡는다.
    location ~ ^/(favicon|osiris-mark)[^/]*$ {
    }
}
