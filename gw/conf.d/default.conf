# osiris-gw — 안정적 이음새 (stable seam, §2.3).
#
# **프레임워크 계약(I5 2차 수정, 사용자 지시)**: osiris-gw는 포트에서
# 수신한다. 어떤 상위 게이트웨이가 앞에 있어도, 없어도 동작한다 — 도메인
# (`server_name`)을 이 설정에 박아 두지 않는다. 공개 도메인·상위 게이트웨이
# 유무·TLS 종단 위치는 전부 **온보딩이 결정할 항목**이다(설계 §2,
# docs/design/IMPLEMENTATION-NOTES.md I5 §56). 이 파일은 어떤 Host 헤더로
# 와도 같은 방식으로 응답하는 catch-all 서버 하나뿐이다.
#
# 이 호스트의 예시 배포(부록): 상위에 리버스 프록시(nginx 등, 이 프레임워크 밖의
# 자산)가 있고 TLS를 거기서 종단한 뒤 평문 HTTP로 이 컨테이너에 넘긴다
# (D9). `docker-compose.dev-net.yml` 오버레이를 쓰면 그 상위가 `osiris-gw`
# 라는 이름으로 이 컨테이너를 찾는다. 이건 **하나의 배포 예시일 뿐**이고,
# 상위 게이트웨이가 없는 기본 설치에서는 `127.0.0.1:${OSIRIS_GW_HOST_PORT}`
# 로 브라우저가 직접 여기에 닿는다 — 두 경우 모두 아래 설정은 동일하다.
#
# ---------------------------------------------------------------------------
# I5 3차 수정 — `/`(정확히 그 경로) 말고는 전부 omniroute로 (사용자 확정)
#
# 실측(감독): 브라우저로 `/omni/`에서 로그인하면 `https://<origin>
# /api/auth/login`으로 POST된다 — `/omni/api/auth/login`이 아니라. 원인은
# omniroute 자신에 있다: Next.js `basePath`는 `next/link`·라우터·정적 에셋
# (`/_next/...`)에는 자동 적용되지만, **코드 안의 리터럴 절대경로 문자열**
# (`fetch("/api/...")`, `<a href="/dashboard/...">` 등)에는 붙지 않는다.
#
# `/app/src`를 grep한 결과 `/api/`만 **420개 파일**에 리터럴로 있고
# (`/api/settings` 82곳, `/api/providers` 58곳 등), 그 밖에도 브라우저가
# 직접 호출/링크하는 절대경로가 더 있었다 — `fetch("/v1/models")`,
# `fetch("/a2a", ...)`(Playground/CLI 도구/A2A 대시보드), 그리고 `<a
# href="/dashboard/...">`, `/status`, `/docs`, `/login`, `/terms`,
# `/privacy`, `/openapi.yaml` 등 순수 내비게이션 링크까지. 중앙 API
# 헬퍼가 없어(`basePath` 참조는 i18n 번역 파일뿐) 호출 지점을 전부 찾아
# 고치는 것은 비현실적이고, 고쳐도 upstream 버전마다 재발한다.
#
# **omniroute 소스는 한 줄도 고치지 않는다.** 대신 경로 소유권을
# 뒤집었다 — 화이트리스트(부서진 리터럴을 하나씩 찾아 개별 location을
# 추가)가 아니라 **블랙리스트**(OSiris가 명시적으로 예약한 몇 개 경로만
# 빼고 나머지 전부는 기본적으로 omniroute로 간다)로 설계했다. 개별
# `/api/`, `/v1/`, `/a2a` location을 따로 만드는 방식은 처음엔 그렇게
# 했지만, 그 뒤 발견한 순수 내비게이션 링크(`/dashboard/*`, `/status`,
# `/login`, ...)까지 보고 나서 "이런 리터럴이 얼마나 더 있을지 모른다"는
# 결론에 도달해 이 블랙리스트 구조로 다시 짰다 — 앞으로 이 벤더 앱의
# 어떤 새 리터럴 절대경로가 나와도(우리가 미리 grep하지 못한 것 포함)
# 자동으로 omniroute에 도달한다.
#
# OSiris 자신의 예약 경로는 `= /`(콘솔 슬롯), `/_api/`(OSiris API, 구
# `/api/`에서 이전 — §2.9 개정, 콘솔 계약 변경, IMPLEMENTATION-NOTES.md I5
# §62 참고, `40-console-ia.md`/`41-console-design-system.md`는 이 워커가
# 고치지 않는다), `/pre-status`(진단 페이지), `/healthz`(컨테이너 내부
# 헬스체크), 이 페이지들이 참조하는 브랜드 정적 파일들(`/favicon*`,
# `/osiris-mark*` 접두사), 그리고 **콘솔 SPA 워커가 추가한 두 자산 접두사**
# `/assets/`(vite 빌드 산출물 JS/CSS, 해시 파일명이라 접두사 예약 필수)·
# `/brand/`(콘솔 `public/brand/`가 그대로 복사되는 경로 — 지금은 실제로
# fetch하는 코드가 없지만, gw/html의 마크 변형 3종이 열거식이라 404 났던
# 사고(바로 위 문단)와 같은 함정을 예방적으로 닫아 둔다). **이 부류를
# 제외한 모든 경로**(`/api/*`, `/v1/*`, `/a2a`, `/dashboard/*`, `/status`,
# `/login`, ... 지금 알고 있는 것과 앞으로 나올 모르는 것 전부)는 일반
# catch-all `location /`이 `/omni` 접두사를 붙여 omniroute로 넘긴다.
#
# **콘솔 SPA 배선 완료(이 워커)**: 콘솔은 `/`(정확히 그 경로) 밖의 최상위
# 경로를 쓰지 않는다(순수 React state 라우팅, `console/README.md` "화면
# 전환은 URL 라우팅이 아니라 React state" 참고) — 그래서 블랙리스트
# 방식과 충돌하지 않는다. 다만 vite 빌드 산출물이 최상위 `/assets/*`를
# 절대경로로 참조하므로(`console/dist/index.html`의
# `<script src="/assets/...">`) 그 접두사 하나는 반드시 예약해야 했다 —
# 아래 `location /assets/`·`location /brand/`가 그것. `= /` 블록은
# **proxy_pass가 아니라 정적 파일 서빙**으로 구현했다(콘솔이 별도
# 컨테이너/업스트림이 아니라 이 nginx 이미지 레이어에 빌드 산출물로
# 구워지기 때문 — gw/Dockerfile 참고, docker-compose.yml의 osiris-gw
# 서비스가 `build:`로 전환됨).
# ---------------------------------------------------------------------------

resolver 127.0.0.11 valid=10s ipv6=off;

# WebSocket 업그레이드 표준 관용구 — 일반 HTTP 요청은 Connection을 그대로
# 두고, Upgrade 헤더가 있는 요청만 "upgrade"로 넘긴다. omniroute에 실제 WS
# 업그레이드 경로가 있다(소스 확인: `/app/server-ws.mjs`가 `http.Server`의
# `upgrade` 이벤트를 감싸고, `/app/responses-ws-proxy.mjs`의
# RESPONSES_WS_PUBLIC_PATHS = {"/responses","/v1/responses",
# "/api/v1/responses"}가 업그레이드 대상이다 — 추측이 아니라 소스 확인).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;   # 어떤 Host 헤더로도 응답 — 도메인은 온보딩이 결정할 배포 시점 정보다

    # ------------------------------------------------------------------
    # 경로 네임스페이스 (설계 §2.9, I5 3차 수정 — 갱신된 표는
    # docs/design/10-core-architecture.md §2.9 참고):
    #   = /          — **콘솔 슬롯.** 콘솔이 서면 이 블록 하나만
    #                  `proxy_pass http://$api_up;`(SSE 옵션 포함)로 교체.
    #   /_api/       — **OSiris API**(구 `/api/`, 여기로 이전됨). 게이트웨이가
    #                  `/_api/*` → osiris-api 내부의 `/api/*`로 되돌려 벗겨
    #                  준다 — osiris-api 자신은 `40-console-ia.md`가 이미
    #                  정의한 그대로 `/api/*`를 구현하면 되고 그 문서를 고칠
    #                  필요가 없다. **콘솔의 클라이언트(브라우저) 쪽 base
    #                  URL만 `/_api/`로 바뀐다** — 콘솔 워커에게 인계.
    #   /_api/events — OSiris SSE(구 `/api/events`). 별도 location 없이
    #                  `/_api/` prefix 블록의 SSE 설정(D20/§2.7, 값 불변)을
    #                  그대로 상속한다.
    #   /pre-status  — 플랫폼 헬스 진단 정적 페이지.
    #   /favicon.*, /osiris-mark.svg — OSiris 브랜드 정적 파일 4개(콘솔 슬롯이
    #                  참조).
    #   그 외 전부    — **omniroute** (`/omni` 접두사를 붙여 전달). `/omni/`
    #                  자체(이미 접두사가 있는 요청)는 접두사를 또 붙이지
    #                  않도록 별도 location으로 먼저 잡는다. **에이전트
    #                  추론 경로(OSIRIS_GATEWAY_BASE_URL)는 이 게이트웨이를
    #                  전혀 거치지 않는다**(osiris-egress CONNECT 터널로
    #                  osiris-omniroute에 직접 닿는다, §8.3) — 아래 catch-all
    #                  은 순수하게 브라우저의 omniroute 대시보드 UI를 위한
    #                  것이고 에이전트 경로와 무관하다.
    #
    #   **보안 판단(사용자 확인 전까지 기본 비활성)**: 온보딩이 실제로
    #   프로바이더 API 키를 omniroute에 넣으므로, omniroute 경로 전체를
    #   인터넷에 그대로 여는 것은 "프로바이더 자격증명을 가진 관리 UI를
    #   공개"하는 것과 같다. omniroute 자신의 인증(비밀번호 1개 + JWT 쿠키,
    #   브루트포스 가드 있음 — IMPLEMENTATION-NOTES I5 §55 실측)은 다단계
    #   인증이나 IP 제한이 없어 인터넷에 그대로 노출하기엔 얇다. 게이트웨이
    #   레벨 2차 인증 자리(주석 처리, 기본 비활성)를 아래 catch-all에
    #   준비해 뒀다 — 활성화는 사용자 결정.
    # ------------------------------------------------------------------

    # osiris-api / osiris-omniroute 업스트림. 지연 해석 변수를 쓴다 — 아직
    # 존재하지 않아도(osiris-api, 이번 단계 범위 밖) nginx는 정상 기동한다.
    set $api_up "osiris-api:8443";
    set $omni_up "osiris-omniroute:20128";

    # 컨테이너 내부 헬스체크(어떤 상위 게이트웨이도 거치지 않는 요청)만을
    # 위한 예외. 외부에서 이 경로로 정보를 얻어갈 것이 없으므로 그대로 둔다.
    location = /healthz {
        default_type text/plain;
        return 200 "osiris-gw ok\n";
    }

    # -------------------------------------------------------------
    # OSiris 자신의 API — 구 `/api/`, 이제 `/_api/`. SSE 설정값은 전부
    # 검증된 그대로이고 경로만 옮겼다(D20/§2.7 준수 그대로 유지).
    # -------------------------------------------------------------
    location /_api/ {
        # osiris-api 자신은 `/api/*`를 구현한다(40-console-ia.md의 계약
        # 그대로, 그 문서를 고치지 않기 위해). 게이트웨이만 공개 경로
        # `/_api/`를 osiris-api 내부 경로 `/api/`로 되돌려 벗겨준다.
        #
        # **실측 함정**: `proxy_pass http://$api_up/api/;`처럼 업스트림
        # 부분이 변수이면 nginx가 location 접두사를 뒤 URI로 치환하는 자동
        # 규칙이 **적용되지 않는다** — 실측(아래 catch-all 개발 중 확인):
        # 그렇게 두면 백엔드가 세그먼트가 잘린 잘못된 리다이렉트를 돌려줬다.
        # 대신 `rewrite ... break;`로 URI를 직접 바꾸고 `proxy_pass`는
        # URI 없이(변수만) 쓴다 — 이건 항상 원본 요청 URI 전체를 그대로
        # 넘기므로 rewrite가 만든 새 URI가 그대로 전달된다.
        rewrite ^/_api/(.*)$ /api/$1 break;
        proxy_pass http://$api_up;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        # 상위 게이트웨이가 있다면(예: 상위 nginx) 이미 정규화해 준
        # 값을 그대로 신뢰한다(§2.8). 상위 게이트웨이 없이 직접 접근하는
        # 기본(로컬호스트) 배포에서는 이 헤더가 비거나 클라이언트가 임의로
        # 보낸 값일 수 있다 — 용도가 감사 로그/레이트리밋뿐이라(§2.8
        # "인가 결정에는 쓰지 않는다") 인가 경로에는 영향이 없다.
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";

        # --- SSE 필수 (D20 / §2.7) — 두 홉 중 이쪽 홉. 값은 그대로, 경로만 이전 ---
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
        chunked_transfer_encoding  on;
        gzip                       off;
    }

    # 플랫폼 진단 페이지 — gw/render-status.sh가 gw/html/pre-status.html로
    # 굽는다.
    location = /pre-status {
        root /usr/share/nginx/html;
        try_files /pre-status.html =404;
    }

    # OSiris 브랜드 정적 파일 — 콘솔 SPA(`= /`, 이미지에 구워진
    # /usr/share/nginx/console)와 진단 페이지(pre-status.html)가 참조하는 것.
    #
    # **파일명 열거가 아니라 두 접두사(`favicon*`, `osiris-mark*`)로 예약한다.**
    # 이유: 처음엔 4개를 `location =`로 열거했는데, 그 뒤 마크의 테마 변형
    # 3종(`-auto`/`-gold`/`-ink`)을 brand/에서 추가하자 목록에 없어 catch-all을
    # 타고 omniroute로 떨어져 **404가 났다**(실제로 발생). 브랜드 자산은 앞으로도
    # 늘어나므로 열거는 반드시 다시 깨진다.
    #
    # 확장자 기준(`\.svg$` 같은 것)으로 넓히지는 말 것 — omniroute 자신의
    # `/providers/*.png` 같은 정적 파일까지 가로채게 된다. 이 두 접두사는
    # OSiris 브랜드 자산에만 쓰는 이름이라 그 위험이 없다.
    #
    # 정규식 location은 prefix location보다 먼저 평가되므로 아래 catch-all보다
    # 우선한다. `/omni/`·`/_api/` 등 다른 예약 경로와는 패턴이 겹치지 않는다.
    location ~ ^/(favicon|osiris-mark)[^/]*$ {
        root /usr/share/nginx/html;
    }

    # -------------------------------------------------------------
    # 콘솔 SPA 정적 자산 — vite 빌드 산출물이 최상위 절대경로로 참조하는
    # 두 접두사. **파일명이 아니라 디렉터리 단위로 예약한다** — 위 브랜드
    # 자산 주석이 이미 경고한 바로 그 함정(열거는 반드시 다시 깨진다,
    # 해시 파일명은 매 빌드 갱신되므로 특히 더 그렇다). 루트는
    # gw/Dockerfile이 이미지 레이어에 구운 console/dist 사본
    # (/usr/share/nginx/console) — gw/html(호스트 바인드 마운트)과는
    # 별개 경로라 서로 그림자를 드리우지 않는다.
    # -------------------------------------------------------------
    location /assets/ {
        root /usr/share/nginx/console;
    }
    location /brand/ {
        root /usr/share/nginx/console;
    }

    # 콘솔 슬롯 — **정확히 `/`뿐**(prefix 아님). 콘솔이 실제 SPA로 섰다
    # (이 워커) — 별도 업스트림 컨테이너로 proxy_pass하는 대신, 콘솔 빌드
    # 산출물이 이 nginx 이미지 자체의 레이어에 구워져 있으므로(위 §
    # 주석, gw/Dockerfile) 정적 파일 서빙으로 구현한다.
    location = / {
        root /usr/share/nginx/console;
        # NOT `index index.html;` — deliberately. nginx's `index` directive
        # serves a directory URI ("/") by doing an INTERNAL REDIRECT to
        # "/index.html" and RE-RUNNING location matching on that new URI.
        # There is no `location = /index.html` (and no reason to add one —
        # that would just be a second exact-match location to keep in sync
        # with this one), so that internal redirect fell all the way through
        # to the catch-all `location /` below, which prefixes it to
        # `/omni/index.html` and serves OMNIROUTE's 404 page instead of the
        # console slot. `try_files` does not re-enter location matching —
        # it serves the named file directly — which is exactly why
        # `location = /pre-status`'s identical pattern already worked.
        # Found and fixed by actually curling `/` end-to-end rather than
        # trusting the config to be self-evidently correct.
        try_files /index.html =404;
    }

    # -------------------------------------------------------------
    # omniroute 자신 — `/omni/`(이미 접두사가 있는 요청)는 그대로 전달한다
    # (아래 catch-all이 또 `/omni`를 붙이면 이중 접두사가 되므로 먼저 잡음).
    # -------------------------------------------------------------

    # `/omni`(트레일링 슬래시 없음) — omniroute 자신이 내부적으로 트레일링
    # 슬래시를 정규화하며 이 정확한 경로로 리다이렉트한다(실측 확인, 아래
    # catch-all 개발 중 발견 — IMPLEMENTATION-NOTES I5 §57). 없으면 정적
    # 콘솔 슬롯으로 잘못 떨어져 리다이렉트 루프처럼 보인다.
    location = /omni {
        proxy_pass http://$omni_up;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";
    }

    location /omni/ {
        # 지금 이 블록의 기본 상태: 라우팅은 살아있고(reachable), 보호는
        # omniroute 자신의 로그인(비밀번호 1개 + JWT 쿠키, 브루트포스
        # 가드 있음 — IMPLEMENTATION-NOTES I5 §55 실측)뿐이다. **온보딩이
        # 여기에 실제 프로바이더 API 키를 넣으므로** 인터넷에 노출하기 전
        # 더 두꺼운 방어가 필요한지는 사용자 판단이다.
        #
        # 게이트웨이 레벨 2차 인증을 얹고 싶으면(권고) 아래 두 줄의 주석을
        # 풀고 `htpasswd -c gw/.htpasswd <user>`로 자격증명을 만들 것 —
        # 이 워커는 이걸 임의로 켜지 않는다(사용자 결정 사항). 켤 경우 아래
        # catch-all에도 같은 auth_basic 두 줄을 반드시 추가할 것 — 안 그러면
        # `/api/`·`/v1/` 등으로 대시보드 자격증명을 우회할 수 있다.
        # auth_basic           "osiris-omniroute admin";
        # auth_basic_user_file /etc/nginx/gw/.htpasswd;

        proxy_pass http://$omni_up;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        # omniroute도 스트리밍 응답(모델 sync, 채팅 토큰, `/omni/v1/messages`
        # 등)을 쓴다 — 버퍼링을 끈다.
        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
        chunked_transfer_encoding  on;
        gzip                       off;
    }

    # -------------------------------------------------------------
    # catch-all — 위 예약 경로(healthz/_api/pre-status/favicon·mark/= 루트/
    # omni) 밖의 **모든** 요청은 omniroute의 리터럴 절대경로 버그를 흡수하기
    # 위해 `/omni` 접두사를 붙여 그대로 넘긴다. `/api/*`, `/v1/*`, `/a2a`뿐
    # 아니라 `/dashboard/*`, `/status`, `/login`, `/docs`, `/terms`,
    # `/openapi.yaml` 같은 순수 내비게이션 링크, 그리고 지금 이 조사로
    # 찾지 못한 것까지 전부 이 한 블록이 받는다.
    # -------------------------------------------------------------
    location / {
        rewrite ^/(.*)$ /omni/$1 break;
        proxy_pass http://$omni_up;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_x_real_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        proxy_buffering            off;
        proxy_cache                off;
        proxy_read_timeout         3600s;
        proxy_send_timeout         3600s;
        chunked_transfer_encoding  on;
        gzip                       off;
    }
}
