// OSiris NATS JetStream [1단계] — 플랫폼 기동 골격.
// 서브젝트 구조 · 스트림 정의(INBOX/TASKS/TRANSCRIPT/COST) · ACL 모델은
// docs/design/10-core-architecture.md §7(불변 자산)의 소관이며 osiris-core/
// osiris-orchestrator가 구현될 때 여기 채워진다. 지금은 JetStream이 켜진 상태로
// 컨테이너가 healthy하게 뜨는 것까지만 책임진다.

server_name: osiris-nats
listen: 0.0.0.0:4222

# 모니터링/헬스체크용 HTTP 엔드포인트. dev-net에는 노출되지 않는다
# (osiris-data + osiris-agents 네트워크에만 존재하는 컨테이너이므로).
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
  max_memory_store: 1GB
  max_file_store: 10GB
}

# ---------------------------------------------------------------------------
# 인증/ACL — osiris-orchestrator 구현 시 채움 (이전 격차 G-1 해소).
#
# 전체 authorization{} 블록은 이 파일에 직접 두지 않는다 — osiris-core/
# osiris-orchestrator의 정적 사용자와 팀별 에이전트 사용자(조직 규모에 따라
# 늘고 주는 동적 목록)를 한 파일에서 함께 관리해야 osiris-orchestrator가
# "이 파일 하나를 다시 쓰고 SIGHUP" 만으로 전체를 동기화할 수 있다. 그래서
# 실제 authorization{} 내용은 orchestrator가 쓰고 읽는 별도 파일에 있고,
# 여기서는 include만 한다.
#
# 이 include 대상 파일은 저장소에 기본값(osiris-core/osiris-orchestrator
# 정적 사용자만, 에이전트 0명)으로 커밋되어 있다(nats/generated/
# authorization.conf) — 그래야 osiris-orchestrator가 한 번도 뜬 적 없는
# 최초 `docker compose up`에서도 nats가 빈 include 대상 없이 정상 기동한다.
# osiris-orchestrator가 기동하면 이 파일을 자신의 현재 계산 결과로 즉시
# 덮어써 동기화한다(internal/natsauth).
#
# NATS ACL이 강제하는 것(D14, §7.3): 크로스팀 publish는 서버가 거부한다 —
# 각 에이전트 사용자의 permissions.publish.allow 목록에 자기 팀 서브젝트와
# master.inbox만 있고 다른 팀의 team.<slug>.inbox.*는 없으므로, 그 서브젝트로
# publish를 시도하면 nats-server가 -ERR 로 거부한다. Master(isMaster:true)
# 사용자만 예외로 team.*.inbox.*(모든 팀) publish 권한을 갖는다.
# NOTE: nats-server's `include` resolves relative to nats.conf's own
# directory (/etc/nats/) even for a leading-"/" path — an absolute path here
# gets silently prefixed with /etc/nats/, not treated as host-root-absolute.
# Verified: a bare "/etc/nats-dynamic/..." path 404s as
# "/etc/nats/etc/nats-dynamic/...". Hence the relative "../" form.
include "../nats-dynamic/authorization.conf"
# ---------------------------------------------------------------------------
