# console — K3: "osiris-gw 폐지, 콘솔 SPA는 자기 파드(nginx)가 정적 자산만
# 서빙한다." 경로 분기(`/api/*`)·TLS 종단·SSE 패스스루는 Ingress
# Controller가 맡는다(§3.3) — Ingress는 C-2 범위라 이 파드는 정적 서빙
# 하나만 한다.
#
# `[2026-07-28 Phase C-2b]` 결함 1 해소: 콘솔 전용 이미지가 이제
# console/Dockerfile로 존재한다(osiris/console, values.yaml
# images.console과 동일 리포지토리 이름 — 이미 맞춰져 있었으므로 값 자체는
# 바꾸지 않았다). 그 이미지는 base가 nginxinc/nginx-unprivileged(non-root,
# console/Dockerfile 주석 참고)라 8080에서 수신한다 — 아래 containerPort/
# targetPort/probe port가 80이 아니라 8080인 이유.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "osiris.consoleServiceName" . }}
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    app.kubernetes.io/component: console
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: console
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osiris-console
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    app.kubernetes.io/component: console
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.console }}
  selector:
    matchLabels:
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        app.kubernetes.io/component: console
    spec:
      containers:
        - name: console
          image: "{{ .Values.images.console.repository }}:{{ .Values.images.console.tag }}"
          imagePullPolicy: {{ .Values.images.console.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          # 자격증명이 전혀 없는 정적 파일 서버다 — G5가 걱정하는 대상이
          # 아니다(env가 하나도 필요 없음).
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.resources.console.cpu | quote }}
              memory: {{ .Values.resources.console.memory | quote }}
            limits:
              cpu: {{ .Values.resources.console.cpu | quote }}
              memory: {{ .Values.resources.console.memory | quote }}
