# K4의 대가를 값으로도 갚는다(작업 지시 §2).
#
# 70-kubernetes-deployment.md §0 K4가 실측으로 확인한 사실: 단일 노드에서
# taint/toleration은 자원을 예약하지 않는다 — nodeAffinity로 코어를
# osiris.dev/role=main에 고정해도, 그 노드에 다른(예: osiris-agents가
# 조인 전에는 없지만, 조인 뒤 확산되는) 워크로드가 몰리면 코어가 자원
# 압박으로 밀려날 수 있다는 뜻이다. PriorityClass는 스케줄러가 자원 압박
# 시 우선순위 낮은 파드부터 evict하게 만드는 유일한 표준 수단이라 코어
# 3종(osiris-core/neo4j/nats)에 이 클래스를 준다 — osiris-agents 파드는
# 기본(0) 우선순위로 남아 압박 상황에서 먼저 축출된다.
#
# ResourceQuota/LimitRange(osiris-agents 네임스페이스 자원 상한 자체)는
# 이번 phase 범위가 아니다(C-2/C-3의 몫, 작업 지시 §2) — 여기서는
# PriorityClass 오브젝트만 만든다.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: osiris-core-critical
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
value: 100000
globalDefault: false
description: >-
  osiris-system의 코어 워크로드(osiris-core, neo4j, nats) 전용. K4가 이
  셋을 단일 노드(osiris.dev/role=main)에 고정하므로, 그 노드에서 자원
  경합이 생기면 이 우선순위가 osiris-agents 파드보다 먼저 살아남아야
  한다.
---
# [2026-09-11] 90-infra-topology.md IN13 — 인프라 워크로드용 **최하위**
# 우선순위.
#
# 우선순위 서열(값 큰 쪽이 오래 살아남음):
#   osiris-core-critical  100000   코어(core/neo4j/nats)
#   (기본)                     0   osiris-agents 파드
#   osiris-infra            -100   이관된 인프라 워크로드(예시 앱 등)
#
# IN13의 취지: 공유 단일 노드에서 자원 압박이 오면 **인프라가 가장 먼저
# 축출**되어 AI-org 런타임(system + agents)을 압박하지 못하게 한다. 음수
# 값이라 기본(0)보다도 낮다 — 인프라는 "있으면 좋지만 AI-org보다 뒤"라는
# 위계를 스케줄러가 집행한다.
#
# ★ 한계(정직하게): PriorityClass는 네임스페이스 기본값으로 걸 수 없다
# (k8s에 per-namespace default priority가 없다). 따라서 인프라 워크로드는
# 파드 스펙에 `priorityClassName: osiris-infra`를 **명시**해야 하며, 그것을
# 박는 것은 이관을 실행하는 orchestrator(IN15)의 책임이다 — 이관 manifest
# 생성 시 이 필드를 항상 포함시킨다(IN13 준수 지점). 이 PriorityClass
# 오브젝트는 그 참조 대상을 미리 만들어 둘 뿐이다.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: osiris-infra
  labels:
    {{- include "osiris.commonLabels" . | nindent 4 }}
value: -100
globalDefault: false
description: >-
  이관된 인프라 워크로드 전용 최하위 우선순위. 자원 압박 시 AI-org
  런타임(osiris-system 코어 및 osiris-agents)보다 먼저 축출되어야 한다
  (90-infra-topology.md IN13). 인프라 워크로드는 파드 스펙에
  priorityClassName: osiris-infra 를 명시해야 하며, 이관을 실행하는
  orchestrator가 그 필드를 박는다.
