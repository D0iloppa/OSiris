# osiris-egress — HTTP CONNECT 프록시, 도메인 허용목록(A3, §2 배치도).
# Deployment(K4가 "코어 3종만 StatefulSet+nodeAffinity"라고 명시하므로,
# egress는 상태가 없어 자유 배치되는 Deployment로 둔다 — §2 배치도 원문
# 그대로: "osiris-egress (Deployment)").
#
# egress/squid.conf(compose)의 도메인 허용목록(github/npm/pypi/go 모듈
# 레지스트리 + LLM 프로바이더 도메인, A3 집행)은 배포 방식과 무관하게
# 그대로 옮긴다 — 이관 대상이다(§6.1 "온톨로지·인가·감사 계층은 불변
# 자산").
#
# TODO(감독 판단 필요): compose의 squid.conf는 소스 IP ACL로
# osiris-agents(172.31.240.0/24)/osiris-omniroute(172.31.241.0/24) 두
# 대역을 구분해 "에이전트→pkg/github/omniroute" 허용목록과
# "omniroute 자신→LLM 프로바이더" 허용목록을 분리했다. 이 서브넷은
# compose 네트워크의 고정 IPAM 값이라 k8s Pod CIDR(클러스터마다 다르고
# chart 작성 시점에 알 수 없음)에 그대로 옮길 수 없다. 이 phase는 그
# 소스 IP 분리를 생략하고 도메인 허용목록만 병합해 유지한다 — "어느 pod가
# osiris-egress:3128에 도달할 수 있는가" 자체를 좁히는 실제 집행은 C-2의
# NetworkPolicy가 맡아야 한다(§3.2가 이미 "핀홀을 좁히는 실제 집행 지점"
# 이라 부른 역할). NetworkPolicy 없이 이 chart만 단독 설치하면 그 소스
# 분리가 일시적으로 느슨해진다는 뜻이다 — C-2 완료 전까지 알려진 격차로
# 남긴다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: egress-squid-conf
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    app.kubernetes.io/component: egress
    {{- include "osiris.commonLabels" . | nindent 4 }}
data:
  squid.conf: |
    # egress/squid.conf(compose)를 옮김 — 소스 IP ACL은 위 TODO 참고로
    # 생략하고 목적지 도메인 허용목록만 유지한다. TLS 종단(MITM) 없음 —
    # CONNECT만 중계한다(§3.2).
    visible_hostname osiris-egress
    http_port 3128
    # [2026-09-29 실측] squid 내장 DNS 클라이언트는 기본(dns_defnames off)으로 resolv.conf의
    # search 도메인을 붙이지 않아, 한 단어 이름(osiris-omniroute)이 ERR_DNS_FAIL이 됐다(compose는
    # Docker DNS가 짧은 이름을 풀어 줘서 드러나지 않았음). acl은 요청 호스트로 매칭하므로 허용 범위는 그대로다.
    dns_defnames on

    cache deny all

    acl CONNECT method CONNECT
    acl SSL_ports port 443
    acl SSL_ports port 20128
    acl Safe_ports port 80
    acl Safe_ports port 443
    acl Safe_ports port 20128

    # grant-catalog §8.1 net.egress.github / net.egress.pkg 대응.
    acl allow_domains dstdomain .github.com
    acl allow_domains dstdomain .githubusercontent.com
    acl allow_domains dstdomain registry.npmjs.org
    acl allow_domains dstdomain pypi.org
    acl allow_domains dstdomain files.pythonhosted.org
    acl allow_domains dstdomain proxy.golang.org
    acl allow_domains dstdomain sum.golang.org

    # I5: OSiris 전용 omniroute — 에이전트가 :20128로 도달.
    acl allow_osiris_omniroute dstdomain osiris-omniroute

    # osiris-omniroute 자신이 실제로 호출하는 LLM 프로바이더 도메인.
    acl llm_provider_domains dstdomain api.anthropic.com
    acl llm_provider_domains dstdomain api.openai.com
    acl llm_provider_domains dstdomain generativelanguage.googleapis.com
    acl llm_provider_domains dstdomain aiplatform.googleapis.com
    acl llm_provider_domains dstdomain .openai.azure.com
    acl llm_provider_domains dstdomain api.mistral.ai
    acl llm_provider_domains dstdomain api.cohere.ai
    acl llm_provider_domains dstdomain api.cohere.com
    acl llm_provider_domains dstdomain api.groq.com
    acl llm_provider_domains dstdomain openrouter.ai
    acl llm_provider_domains dstdomain api.together.xyz
    acl llm_provider_domains dstdomain api.deepseek.com
    acl llm_provider_domains dstdomain api.perplexity.ai
    acl llm_provider_domains dstdomain api.x.ai

    http_access deny !Safe_ports
    http_access deny CONNECT !SSL_ports

    http_access allow allow_domains
    http_access allow allow_osiris_omniroute
    http_access allow llm_provider_domains

    http_access deny all
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "osiris.egressServiceName" . }}
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    app.kubernetes.io/component: egress
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: egress
  ports:
    - name: proxy
      port: 3128
      targetPort: 3128
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osiris-egress
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    app.kubernetes.io/component: egress
    {{- include "osiris.commonLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: egress
  template:
    metadata:
      labels:
        app.kubernetes.io/component: egress
    spec:
      containers:
        - name: egress
          image: "{{ .Values.images.egress.repository }}:{{ .Values.images.egress.tag }}"
          imagePullPolicy: {{ .Values.images.egress.pullPolicy }}
          ports:
            - name: proxy
              containerPort: 3128
          volumeMounts:
            - name: squid-conf
              mountPath: /etc/squid/squid.conf
              subPath: squid.conf
              readOnly: true
          # docker-compose.yml의 healthcheck(squid -k check -f squid.conf).
          #
          # ★ [2026-07-28 실배포 실측 — 결함 3] startupProbe 신설 — compose가
          # start_period(10s)/retries(3)를 쓰는 워크로드 전부를 대조한 결과
          # (작업 지시 요구사항), squid 자체는 기동이 빠르지만(별도 실측
          # 이상 없음) 일관성을 위해 나머지 코어 컴포넌트와 같은 패턴을
          # 적용한다. compose 예산(10+30=40초)에 여유를 더해 60초.
          startupProbe:
            exec:
              command: ["squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["squid", "-k", "check", "-f", "/etc/squid/squid.conf"]
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.resources.egress.cpu | quote }}
              memory: {{ .Values.resources.egress.memory | quote }}
            limits:
              cpu: {{ .Values.resources.egress.cpu | quote }}
              memory: {{ .Values.resources.egress.memory | quote }}
      volumes:
        - name: squid-conf
          configMap:
            name: egress-squid-conf
