# RBAC for osiris-api.
#
# ★★★ [2026-09-11] "권한 0" 불변식의 명시적 개정 — docs/design/
# 90-infra-topology.md §4.3(1)이 요구한 그대로, 조용히 확장하지 않고
# 여기 적는다. ★★★
#
# 이 파일은 원래 "osiris-api의 k8s API 권한은 0이다 — RoleBinding을 안
# 만드는 것 자체가 구현"이라고 선언했다(D4/G8). 그 문장은 이제 **정확하지
# 않다** — 아래에는 ClusterRole/ClusterRoleBinding이 실제로 있다.
#
# 개정된 불변식(§4.3(1)의 문구 그대로): "osiris-api는 인프라 토폴로지
# 표시에 필요한 **최소 범위의 읽기 전용** k8s 접근을 가지며, 그 외 모든
# k8s **쓰기** 권한은 여전히 0이다." D4/G8이 실제로 지키려던 것 — "osiris-
# api는 워크로드를 만들거나 고치거나 지우지 못한다" — 은 그대로 유지된다.
# 아래 규칙 어디에도 create/update/patch/delete verb가 없다: 전부
# get/list/watch뿐이다. 이 불변식이 깨지는 유일한 경우는 아래 verbs
# 목록에 그 넷 중 하나라도 추가되는 순간이다 — 리뷰어는 그것만 보면 된다.
#
# bin/verify-isolation-k8s.sh의 [E2→RBAC] 검사는 여전히 유효하다: 그
# 검사는 "osiris-api SA가 **pods를 create**할 수 있는가"만 묻는다(RBAC
# 부재 = docker.sock 부재의 k8s 대응물, D4/G8). 아래는 pods를 **get/list/
# watch**만 주므로 그 검사는 그대로 "cannot-create"로 통과한다 — 읽기
# 확장과 "워크로드를 못 만든다"는 서로 다른 축이다. 그 스크립트의 주석도
# 이 개정을 반영해 갱신했다(파일 하단 참고 대신 그 스크립트 자체를 고쳤다).
#
# 이 확장이 존재하는 이유: 콘솔 Infra 메뉴 A단계(90-infra-topology.md §7)
# — 토폴로지·노드·네임스페이스·파드 상태·metrics 읽기. 범위는 그 문서
# §4.3(2)가 명시한 축소를 그대로 따른다:
#
#   - secrets는 **어떤 verb로도, 어떤 스코프에서도** 주지 않는다.
#   - 워크로드 스펙(Deployment/StatefulSet 등, env·image 포함)은 원래
#     `infra-*` 네임스페이스 Role로만 한정하기로 했다(§4.3(2) (b)) —
#     아래 두 번째 매니페스트(다중 문서, .Values.infraNamespaces로 루프)
#     가 그 자리다. 지금은 infra-* 네임스페이스가 하나도 없으므로
#     (§8 blocker 3/4 — IN13/IN14 미확정) 이 루프는 기본값에서 **아무
#     것도 렌더하지 않는다** — 없는 것을 있는 척 렌더하지 않는다.
#   - ★ 문서화된 편차 하나: §4.3(2)(a)의 초안 YAML은 클러스터 스코프에
#     nodes/namespaces/metrics만 두고 pods는 넣지 않았다. 그대로 두면
#     infra-* 네임스페이스가 하나도 없는 지금, A단계가 약속하는 "토폴로지
#     ↔ 실제 파드"(§7)가 osiris-system/osiris-agents/ingress-nginx 그
#     어느 쪽에도 보이지 않는다 — 이 단계의 실제 착수 지시가 그 상태를
#     받아들이지 말라고 명시했으므로, 이 chart는 **pods(get/list/watch)를
#     클러스터 스코프에 추가**한다. api/internal/k8sread/client.go의
#     Pod 구조체 doc comment가 이 편차의 전체 논거와, 그것이 안전한 이유
#     (RBAC이 아니라 **좁은 Go 구조체 자체**가 스펙 필드를 노출 안 함 —
#     env/시크릿참조/이미지 없음)를 적는다. T1 재검토 시 이 확장을
#     §4.3(2)(a)의 일부로 명시적으로 재확인할 것.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: osiris-api
  namespace: {{ include "osiris.systemNamespace" . }}
  labels:
    app.kubernetes.io/component: api
    {{- include "osiris.commonLabels" . | nindent 4 }}
---
# (a) 클러스터 스코프 — 토폴로지 골격. secrets 없음. pods는 위 편차
# 설명대로 추가(get/list/watch만 — create/update/patch/delete 전혀 없음).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: osiris-api-infra-read
  labels:
    app.kubernetes.io/component: api
    {{- include "osiris.commonLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    # ★ 위 "문서화된 편차" 참고 — §4.3(2)(a) 초안에는 없었다.
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: osiris-api-infra-read
  labels:
    app.kubernetes.io/component: api
    {{- include "osiris.commonLabels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: osiris-api
    namespace: {{ include "osiris.systemNamespace" . }}
roleRef:
  kind: ClusterRole
  name: osiris-api-infra-read
  apiGroup: rbac.authorization.k8s.io
---
{{- /*
(b) 워크로드 read — infra-* 네임스페이스로 한정(§4.3(2)(b)). Role의
합으로 구현한다(ClusterRole이 아니다 — IN7과 같은 원칙: osiris-system/
osiris-agents에는 이 권한이 전혀 닿지 않는다). `.Values.infraNamespaces`
가 비어 있는 동안(오늘의 기본값 — infra-* NS가 아직 없다, §8 blocker
3/4) 이 블록은 아무것도 렌더하지 않는다. 첫 infra-* 네임스페이스가
생성되고 IN13(ResourceQuota+PriorityClass)·IN14(default-deny
NetworkPolicy)가 그 네임스페이스 프로비저닝에 함께 확정되면, 그 이름을
`.Values.infraNamespaces`에 추가하는 것만으로 이 Role/RoleBinding이
자동으로 그 네임스페이스에 바인딩된다 — secrets 없이, get/list/watch만.
*/}}
{{- range .Values.infraNamespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: osiris-api-infra-workload-read
  namespace: {{ . }}
  labels:
    app.kubernetes.io/component: api
    {{- include "osiris.commonLabels" $ | nindent 4 }}
rules:
  - apiGroups: ["", "apps", "networking.k8s.io"]
    resources: ["pods", "services", "deployments", "statefulsets", "persistentvolumeclaims", "ingresses", "events"]
    verbs: ["get", "list", "watch"] # secrets 없음 — §4.3(2)(b)
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: osiris-api-infra-workload-read
  namespace: {{ . }}
  labels:
    app.kubernetes.io/component: api
    {{- include "osiris.commonLabels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: osiris-api
    namespace: {{ include "osiris.systemNamespace" $ }}
roleRef:
  kind: Role
  name: osiris-api-infra-workload-read
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
