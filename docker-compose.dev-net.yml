# docker-compose.dev-net.yml — 선택적 오버레이 (I5 2차 수정, 사용자 지시).
#
# 기본 docker-compose.yml은 어떤 외부 네트워크에도 의존하지 않는다(이식성
# — OSiris는 특정 사이트 구성이 아니라 어디서든 설치되는 프레임워크다).
# 이 오버레이는 **이 개발 호스트처럼** 이미 상위 리버스 프록시가
# 공유 도커 네트워크(`dev-net`) 위에서 돌고 있어, `osiris-gw`가 그 네트워크
# 이름으로 직접 찾아져야 하는 배포에만 쓴다.
#
# 사용법:
#   docker compose -f docker-compose.yml -f docker-compose.dev-net.yml up -d
# (osiris-up이 .env의 DEV_NET_NAME이 설정되어 있고 그 네트워크가 실제로
# 존재할 때 자동으로 이 오버레이를 붙인다 — 수동으로 위 명령을 직접 쓸
# 필요는 보통 없다.)
#
# 이 파일이 하는 일은 딱 하나 — osiris-gw에 dev-net 멤버십을 추가하는 것
# 뿐이다(compose 병합 규칙: 서비스의 `networks:` 리스트는 합쳐진다).
# osiris-egress는 여기 다시 넣지 않는다 — I5 이후 osiris-egress의 실제
# 인터넷 라우팅은 자체 `osiris-outbound` 브리지가 담당하므로 dev-net이
# 더 이상 필요 없다(개인정보/보안 관점에서도 아웃바운드 프록시가 임의의
# 공유망에 발을 걸치지 않는 편이 낫다).
#
# 이 파일을 적용해도 상위 리버스 프록시 쪽 설정(그 프록시의 vhost 파일)은 절대 건드리지 않는다 — 그건 OSiris 밖의 자산이고
# 이미 `osiris-gw`라는 이름 하나로 이 오버레이를 가리키도록 구성되어 있다
# (§2.3 안정적 이음새).
networks:
  dev-net:
    external: true
    name: ${DEV_NET_NAME:-dev-net}

services:
  osiris-gw:
    networks:
      - dev-net
